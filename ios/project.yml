name: UniPO
options:
  bundleIdPrefix: com.unipo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO

packages:
  UniPOCore:
    path: Packages/UniPOCore
  UniPOUI:
    path: Packages/UniPOUI
  UniPOFeatures:
    path: Packages/UniPOFeatures

targets:
  UniPO:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UniPO
    info:
      path: UniPO/Resources/Info.plist
      properties:
        CFBundleDisplayName: UniPO
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "49.234.21.63":
              NSExceptionAllowsInsecureHTTPLoads: true
        API_BASE_URL: $(UNIPO_API_BASE_URL)
        NSPhotoLibraryUsageDescription: UniPO 需要访问相册，用于给帖子添加图片。
    settings:
      base:
        UNIPO_API_BASE_URL: http://49.234.21.63/api/v1
        PRODUCT_BUNDLE_IDENTIFIER: com.unipo.app
        PRODUCT_NAME: UniPO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: UniPO/UniPO.entitlements
      configs:
        Debug:
          UNIPO_API_BASE_URL: http://127.0.0.1:18081/api/v1
    dependencies:
      - package: UniPOCore
      - package: UniPOUI
      - package: UniPOFeatures
