name: unipo-test

services:
  backend-test:
    image: unipo-backend:test
    container_name: unipo-test-backend
    restart: unless-stopped
    env_file:
      - ${UNIPO_TEST_ENV_FILE:-.env.test}
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: 8080
      JAVA_OPTS: -Xms128m -Xmx384m
      STATE_BACKEND: memory
      VERIFICATION_MOCK_ACCEPT_ANY_CODE: "true"
      SMS_MOCK_ACCEPT_ANY_CODE: "true"
      BOOTSTRAP_SEED_DEMO_DATA: "false"
      APNS_ENABLED: "false"
      # 端口直接对公网，没有 nginx 挡 actuator；只暴露健康检查。
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      TZ: Asia/Shanghai
    mem_limit: 768m
    # 2026-10-23 起对公网开放，供真机与模拟器直连；腾讯云安全组需放行 TCP 18081。
    # 测试实例接受任意 4 位验证码，只连 unipo_test 库，绝不能指向生产配置。
    ports:
      - "0.0.0.0:18081:8080"
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

networks:
  infra:
    external: true
    name: unipo_default
