name: unipo-data

services:
  mysql:
    image: ${DOCKER_REGISTRY:-}mysql:8.4
    container_name: unipo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biecuoguo}
      MYSQL_USER: ${MYSQL_USER:-biecuoguo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PUBLIC_BIND:-0.0.0.0}:${MYSQL_PUBLIC_PORT:-12306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: ${DOCKER_REGISTRY:-}minio/minio:latest
    container_name: unipo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data
        minio server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-24880}:9000"
      - "${MINIO_CONSOLE_PORT:-24881}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: ${DOCKER_REGISTRY:-}minio/mc:latest
    container_name: unipo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-campuspo}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-false}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        if [ "$$MINIO_PUBLIC_READ" = "true" ]; then
          mc anonymous set download "local/$$MINIO_BUCKET"
        fi

volumes:
  mysql_data:
  minio_data:
