# Prometheus 抓取配置（单机 / 多实例都适用）。
# backend 是 compose 服务名；如果后端跑在宿主机，把 targets 改成 host.docker.internal:8080。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: unipo-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
