# WebSocket 要 Upgrade 头，Connection 的值随请求是否带 Upgrade 变化——
# 写死 "upgrade" 会让普通请求也带上 Upgrade，长连接/keep-alive 行为会变得奇怪。
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    # 私信走 WS /api/v1/realtime/ws：没有这三行，握手到不了后端（nginx 默认 HTTP/1.0 + 不转发 Upgrade）。
    # 读超时放到 1 小时，否则 WS 心跳之间被 nginx 当空闲连接掐掉。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 只放 health 出去给负载均衡/探活看；prometheus / metrics / env 留在内网。
  # 之前是把 /actuator/ 整个反代出去，公网上能直接抓到 JVM 与业务指标（含 unipo_ratelimit_blocked 等）。
  location = /actuator/health {
    proxy_pass http://backend:8080/actuator/health;
  }

  location /actuator/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
