<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>UniPO</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:Inter,'Microsoft YaHei',sans-serif;">
        <div style="padding:28px 32px;border-radius:28px;background:rgba(255,255,255,.72);box-shadow:0 24px 90px rgba(25,38,59,.16);backdrop-filter:blur(24px);">
          <strong>UniPO</strong>
          <p style="margin:8px 0 0;color:#6d7a8f;">正在加载校园 PO...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && !root.dataset.mounted) {
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:Inter,Microsoft YaHei,sans-serif;"><div style="max-width:560px;padding:28px 32px;border-radius:28px;background:rgba(255,255,255,.78);box-shadow:0 24px 90px rgba(25,38,59,.16);"><strong>页面启动遇到错误</strong><p style="color:#6d7a8f;line-height:1.7;">请刷新页面，或把控制台错误发给 Codex：' +
            String(event.message || '') +
            '</p></div></div>';
        }
      });
    </script>
  </body>
</html>
