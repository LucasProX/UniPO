spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://115.190.3.204:12306/biecuoguo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:biecuoguo}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:biecuoguo_password}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:24MB}
  flyway:
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:biecuoguo}
    secret-key: ${MINIO_SECRET_KEY:biecuoguo_minio_secret}
    bucket: ${MINIO_BUCKET:biecuoguo-media}
    public-read: ${MINIO_PUBLIC_READ:false}
