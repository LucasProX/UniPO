spring:
  datasource:
    url: jdbc:h2:mem:biecuoguo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/local
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  minio:
    endpoint: http://localhost:9000
    public-endpoint: http://localhost:9000
    access-key: biecuoguo
    secret-key: biecuoguo_minio_secret
    bucket: biecuoguo-media
