spring:
  datasource:
    # local profile 默认对接 docker compose --profile local-db 起的 MySQL（宿主机 12306）。
    # 仓库根的 .env 会通过 spring.config.import 覆盖它，通常用不着改这里。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:12306/biecuoguo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:biecuoguo}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:biecuoguo_password}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:12MB}
  flyway:
    locations: classpath:db/migration

app:
  auth:
    # 本地是 http://127.0.0.1:5173，Secure Cookie 不会被浏览器保存，必须关掉。
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  jwt:
    # 本地专用签名密钥。非 local/dev/test profile 下用这个值会被 StartupSafetyGuard 拒绝启动，
    # 防止它被顺手复制到生产。
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-never-deploy-this-01}
  # 下面两项是本地开发专属的开闸，生产默认值都是关的（见 application.yml 的注释）。
  verification:
    # 还没接 SMTP，本地注册/改密需要能随便填 4 位数字。
    mock-accept-any-code: true
  sms:
    # 本地没有真实短信通道，固定码 123456；非 local 环境禁止打开。
    mock-accept-any-code: true
  bootstrap:
    # 本地专用的首次管理员密码；生产配置没有默认值，并会要求显式提供随机密码。
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}
    # 写入 good / xiaoba / yuanhua 三个演示账号。生产不要开。
    seed-demo-data: true
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:biecuoguo}
    secret-key: ${MINIO_SECRET_KEY:biecuoguo_minio_secret}
    bucket: ${MINIO_BUCKET:biecuoguo-media}
    public-read: ${MINIO_PUBLIC_READ:false}
