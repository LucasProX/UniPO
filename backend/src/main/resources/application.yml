server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: biecuoguo-backend
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:24MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://115.190.3.204:12306/biecuoguo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:biecuoguo}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:biecuoguo_password}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # 数据库 DATETIME（无时区）按这个时区解释，出参统一转成带偏移的 OffsetDateTime。
  # 显式配置而不是依赖 JVM 默认时区：换服务器时区不会改变接口语义。
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-very-long-random-string-32-plus}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@biecuoguo.local}
    # 只在管理员账号「不存在」时用来创建一次；已存在则不再读取，不会覆盖已有密码。
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}
    # 是否写入演示账号（good / xiaoba / yuanhua）与演示数据。
    # 默认 false——生产库里不该有这些账号。本地由 application-local.yml 打开。
    seed-demo-data: ${BOOTSTRAP_SEED_DEMO_DATA:false}
  verification:
    # 默认 false。打开后任意 4 位数字都能通过验证码校验，等于人人可注册任意邮箱。
    # 只在本地开发（还没接 SMTP）时由 application-local.yml 打开；
    # 非 local/dev/test profile 下打开会直接启动失败，见 config/StartupSafetyGuard.java。
    mock-accept-any-code: ${VERIFICATION_MOCK_ACCEPT_ANY_CODE:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:biecuoguo}
    secret-key: ${MINIO_SECRET_KEY:biecuoguo_minio_secret}
    bucket: ${MINIO_BUCKET:biecuoguo-media}
    public-read: ${MINIO_PUBLIC_READ:false}
