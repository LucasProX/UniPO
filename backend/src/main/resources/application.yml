server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: biecuoguo-backend
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:12MB}
  # 验证码「真实模式」用的 SMTP。默认全空。
  # host 为空时 Spring 不会创建 JavaMailSender，config/StartupSafetyGuard.java 会因此拒绝启动 ——
  # 因为真实模式下没有 SMTP，验证码永远发不出去，等于新用户永远注册不了。
  # 本地开发走 application-local.yml 的 mock 模式（任意 4 位数字放行），不需要配这些。
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          # 465 端口走 SMTPS，开 ssl；用 587 则把 ssl 关掉、starttls 打开。
          ssl:
            enable: ${SMTP_SSL_ENABLE:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
  datasource:
    # 默认指向本机 3306，不指任何远端库：以前这里写的是一台已经停用的服务器，
    # 一旦那个端口被放开，照默认启动就会对着一台陌生库跑 Flyway 和启动初始化逻辑。
    # 真实部署一律用 SPRING_DATASOURCE_URL 显式覆盖，不要依赖这个默认值。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/biecuoguo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:biecuoguo}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:biecuoguo_password}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 只有 app.state.backend=redis 才会真的连它。默认 memory 模式下这个配置不会被用到，
  # Lettuce 也是懒连接，所以本地不起 Redis 也能正常跑。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 日志里固定带 requestId：线上排查时用户给一个 requestId 就能把所有相关日志串起来。
# 格式刻意保持单行、可 grep；接 Loki/ELK 时再换 JSON encoder。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n"

management:
  endpoints:
    web:
      exposure:
        # prometheus 走内网 scrape；Caddy 只反代 /api，不会把它暴露到公网。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # kubernetes 风格的 /health/liveness 与 /health/readiness；单机也用得上（部署脚本探活）。
      probes:
        enabled: true
  metrics:
    tags:
      application: unipo
  # 关掉 mail 健康检查。只要 spring.mail.host 这个键存在（哪怕值是空串），
  # Spring 就会创建 JavaMailSender 并注册 MailHealthIndicator；没配 SMTP 时它连不上，
  # 会把 /actuator/health 拖成 DOWN —— 容器健康检查和部署全挂。
  # 「有没有配 SMTP」由 config/StartupSafetyGuard.java 在启动时判断，不靠这个探针。
  health:
    mail:
      enabled: false
    # 同理：memory 模式下没有任何 redis 连接，探针会把 /actuator/health 拖成 DOWN。
    # redis 模式下的连通性由 state/RedisStateGuard.java 在启动时验证（连不上直接起不来）。
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    # Web 端登录态：Cookie 里只放不透明 session id，服务端（Redis）存 userId/role/csrfToken。
    # 这和 App 的 Bearer token 是两套载体，共用同一个用户身份；见 ADR-0001 D3。
    session-cookie-name: unipo_sid
    csrf-cookie-name: unipo_csrf
    csrf-header-name: X-CSRF-Token
    # 会话空闲有效期（分钟），默认 7 天；每次访问滑动续期。
    session-ttl-minutes: ${AUTH_SESSION_TTL_MINUTES:10080}
    # HTTPS 部署必须 true。默认 false 是为了「IP + HTTP」部署不静默失效（Cookie 存不下、登录看似成功）；
    # docker-compose 里默认 true（有 Caddy），纯 HTTP 的 deploy-ip.sh 部署要在 .env 里显式设 false。
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: Lax
  # 撤销名单（退出登录）/ 在线状态 / 限流计数 放哪：
  #   memory = 进程内（默认，单实例足够，重启即清空）
  #   redis  = 多实例共享，必须设 REDIS_HOST/REDIS_PORT；连不上会启动失败
  # 部署多副本时务必改成 redis，否则「A 退出登录、B 还认这个 token」（ISSUES Q-4）。
  state:
    backend: ${STATE_BACKEND:memory}
  # 数据库 DATETIME（无时区）按这个时区解释，出参统一转成带偏移的 OffsetDateTime。
  # 显式配置而不是依赖 JVM 默认时区：换服务器时区不会改变接口语义。
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  # 没有「所属学校」时的默认学校：未登录访客看 feed、新注册用户还没选学校都用它。
  # 以前访客分支是随便挑一个 active 用户借 school_id，同一个请求两次可能不一样。
  default-school-id: ${APP_DEFAULT_SCHOOL_ID:1}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  rate-limit:
    # 登录 / 验证码 / 注册 / 改密 / 上传 / 发帖 按「来源 IP + 接口」限流，命中回 429。
    # 规则表在 web/RateLimitFilter.java，实现是进程内的固定窗口（多实例时各算一份，见 ISSUES Q-4）。
    enabled: ${RATE_LIMIT_ENABLED:true}
    # 只有「前面确实有代理、外部连不到后端」时才打开：打开后按 X-Forwarded-For 第一段取 IP。
    # 关闭时用 remoteAddr——但部署在 Caddy 后面时那是 Caddy 的地址，会让所有人共用一个桶。
    # docker-compose 里默认 true（因为它一定带 Caddy），本地直连后端时保持 false。
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  jwt:
    # 没有默认值：签名密钥一旦公开，任何人都能伪造一个 role=ADMIN 的 token。
    # 缺失/还是示例值/短于 32 字符时 StartupSafetyGuard 会拒绝启动（见 config/StartupSafetyGuard.java）。
    # 本地开发由 application-local.yml 提供专用值，不用配这个。
    secret: ${JWT_SECRET:}
    # access token 有效期（分钟）。故意短——过期后用 refresh token 换新的（POST /api/auth/refresh），
    # 不再像以前那样一签就是 7 天。
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    # refresh token 有效期（分钟），默认 14 天。只在换 token 和退出登录时用到。
    refresh-expiration-minutes: ${JWT_REFRESH_EXPIRATION_MINUTES:20160}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@biecuoguo.local}
    # 仅首次创建管理员时使用。生产必须显式提供随机密码；启动检查会拒绝空值、占位值和过短值。
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    # 是否写入演示账号（good / xiaoba / yuanhua）与演示数据。
    # 默认 false——生产库里不该有这些账号。本地由 application-local.yml 打开。
    seed-demo-data: ${BOOTSTRAP_SEED_DEMO_DATA:false}
  verification:
    # 默认 false。打开后任意 4 位数字都能通过验证码校验，等于人人可注册任意邮箱。
    # 只在本地开发（还没接 SMTP）时由 application-local.yml 打开；
    # 非 local/dev/test profile 下打开会直接启动失败，见 config/StartupSafetyGuard.java。
    mock-accept-any-code: ${VERIFICATION_MOCK_ACCEPT_ANY_CODE:false}
  sms:
    # 真实短信通道未接；只有 local/dev/test 可以打开 mock（固定码 1234，任意 4 位通过）。
    mock-accept-any-code: ${SMS_MOCK_ACCEPT_ANY_CODE:false}
  push:
    apns:
      # 没有 .p8 时保持 false；本地只打日志，不影响发消息。
      enabled: ${APNS_ENABLED:false}
      key-path: ${APNS_KEY_PATH:}
      key-id: ${APNS_KEY_ID:}
      team-id: ${APNS_TEAM_ID:}
      topic: ${APNS_TOPIC:com.unipo.app}
      production: ${APNS_PRODUCTION:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:biecuoguo}
    secret-key: ${MINIO_SECRET_KEY:biecuoguo_minio_secret}
    bucket: ${MINIO_BUCKET:biecuoguo-media}
    public-read: ${MINIO_PUBLIC_READ:false}
