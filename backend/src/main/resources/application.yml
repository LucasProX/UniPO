server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: biecuoguo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/biecuoguo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:biecuoguo}
    password: ${SPRING_DATASOURCE_PASSWORD:biecuoguo_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-very-long-random-string-32-plus}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@biecuoguo.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:biecuoguo}
    secret-key: ${MINIO_SECRET_KEY:biecuoguo_minio_secret}
    bucket: ${MINIO_BUCKET:biecuoguo-media}
