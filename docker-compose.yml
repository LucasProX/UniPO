name: unipo

services:
  mysql:
    image: ${DOCKER_REGISTRY:-}mysql:8.4
    container_name: unipo-mysql
    profiles:
      - local-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biecuoguo}
      MYSQL_USER: ${MYSQL_USER:-biecuoguo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-biecuoguo_password_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - unipo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MYSQL_PUBLIC_BIND:-0.0.0.0}:${MYSQL_PUBLIC_PORT:-12306}:3306"

  minio:
    # MinIO 官方 Docker Hub 镜像在当前网络下拉取失败（denied / not found），
    # 本机改用 Bitnami 打包的同款 MinIO 服务端镜像；可用 MINIO_IMAGE 覆盖。
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    container_name: unipo-minio
    profiles:
      - local-db
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-biecuoguo-media}
      MINIO_BROWSER: "on"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - unipo_minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: unipo-redis
    # 两个 profile 都能拉起它：local-db（本地想试 redis 模式）和 redis（多实例部署必备）。
    profiles:
      - local-db
      - redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - unipo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # 默认只绑本机：生产用的 redis 不该暴露到公网。
      - "${REDIS_PUBLIC_BIND:-127.0.0.1}:${REDIS_PUBLIC_PORT:-6379}:6379"

  # 指标采集（可观测性）。只在需要看监控时拉起：
  #   docker compose --profile observability up -d prometheus
  # 单机部署也不额外占常驻资源——不启这个 profile 就完全不跑。
  prometheus:
    image: ${DOCKER_REGISTRY:-}prom/prometheus:latest
    container_name: unipo-prometheus
    profiles:
      - observability
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - unipo_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PUBLIC_BIND:-127.0.0.1}:${PROMETHEUS_PUBLIC_PORT:-9090}:9090"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
    container_name: unipo-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      # 默认走 compose 网络里的 mysql 服务（整栈 docker compose up 时用这个）；
      # 连外部库请显式设 SPRING_DATASOURCE_URL，别再指望一个写死的远端地址。
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/biecuoguo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      # 没有「所属学校」时的默认学校；必须指向 schools 表里真实存在的行。
      APP_DEFAULT_SCHOOL_ID: ${APP_DEFAULT_SCHOOL_ID:-1}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-biecuoguo}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-biecuoguo_password_change_me}}
      # 没有默认值：compose 缺这个变量就直接报错，不要让它悄悄用一个公开的密钥启动。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须显式配置（openssl rand -base64 48）}
      # 整栈一定带 Caddy，后端只从 Caddy 收流量，所以这里必须按 X-Forwarded-For 取真实 IP；
      # 否则所有人的 remoteAddr 都是 Caddy，限流会退化成「全站共用一个桶」。
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-true}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      JWT_REFRESH_EXPIRATION_MINUTES: ${JWT_REFRESH_EXPIRATION_MINUTES:-20160}
      # Web 会话 Cookie：整栈有 Caddy + HTTPS，Secure 默认开；纯 HTTP 的 IP 部署要在 .env 里设 false。
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-10080}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@biecuoguo.local}
      # 首次初始化管理员的凭据不得使用公开默认值；生成随机值后写入 .env。
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD 必须显式配置（openssl rand -hex 32）}
      # 危险开关，默认关。打开会在生产库里写弱口令演示账号 / 让任意 4 位数字通过验证码。
      # 非 local/dev/test profile 下打开会直接拒绝启动。
      BOOTSTRAP_SEED_DEMO_DATA: ${BOOTSTRAP_SEED_DEMO_DATA:-false}
      VERIFICATION_MOCK_ACCEPT_ANY_CODE: ${VERIFICATION_MOCK_ACCEPT_ANY_CODE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      # 数据库 DATETIME 的解释时区；有安全默认值，不设也能跑
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      # 撤销名单 / 在线状态 / 限流计数存哪。单实例 memory 够用；
      # 起多副本（或加网关后要多实例）必须换成 redis，否则各实例状态不共享（ISSUES Q-4）。
      # 换 redis 时记得同时带上 --profile redis 把上面的 redis 服务拉起来。
      STATE_BACKEND: ${STATE_BACKEND:-memory}
      MESSAGE_OUTBOX_ENABLED: ${MESSAGE_OUTBOX_ENABLED:-true}
      MESSAGE_OUTBOX_POLL_INTERVAL_MS: ${MESSAGE_OUTBOX_POLL_INTERVAL_MS:-1000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required in .env}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required in .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required in .env}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-false}
      # APNs 默认关闭；打开后需要把 .p8 挂进容器并设置 APNS_KEY_PATH。
      APNS_ENABLED: ${APNS_ENABLED:-false}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-com.unipo.app}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      TZ: Asia/Shanghai
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
    container_name: unipo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  caddy:
    image: ${DOCKER_REGISTRY:-}caddy:2-alpine
    container_name: unipo-caddy
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  unipo_prometheus_data:
  unipo_mysql_data:
  unipo_redis_data:
  unipo_minio_data:
  caddy_data:
  caddy_config:
