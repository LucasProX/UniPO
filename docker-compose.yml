services:
  mysql:
    image: mysql:8.4
    container_name: biecuoguo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biecuoguo}
      MYSQL_USER: ${MYSQL_USER:-biecuoguo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-biecuoguo_password_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MYSQL_PUBLIC_BIND:-127.0.0.1}:${MYSQL_PUBLIC_PORT:-3306}:3306"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: biecuoguo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-biecuoguo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-biecuoguo_minio_secret}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PUBLIC_BIND:-127.0.0.1}:${MINIO_PUBLIC_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLIC_BIND:-127.0.0.1}:${MINIO_CONSOLE_PUBLIC_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: biecuoguo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-biecuoguo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-biecuoguo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-biecuoguo_password_change_me}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-very-long-random-secret-32}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-10080}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@biecuoguo.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123456}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-biecuoguo}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-biecuoguo_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-biecuoguo-media}
      TZ: Asia/Shanghai
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    container_name: biecuoguo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  mysql_data:
  minio_data:
