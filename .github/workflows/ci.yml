name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn package（含单元测试）
        working-directory: backend
        run: mvn -B package

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm run lint（eslint 基线）
        working-directory: frontend
        run: npm run lint
      - name: npm run build（vue-tsc + vite，类型错会红）
        working-directory: frontend
        run: npm run build

  files:
    name: 脚本与换行自查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .sh 必须是 LF 且语法正确
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::.sh 必须是 LF 换行"
              exit 1
            fi
          done
      - name: .ps1 必须是 CRLF
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.ps1'); do
            if ! grep -qU $'\r' "$f"; then
              echo "::error file=$f::PowerShell 5.1 解析 LF-only 的 .ps1 会静默出错，必须 CRLF"
              exit 1
            fi
          done
      - name: .env 不能入库
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 里有真实密钥，不能提交"
            exit 1
          fi

  smoke:
    name: 启动 + 接口冒烟（真 MySQL）
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biecuoguo
          MYSQL_USER: biecuoguo
          MYSQL_PASSWORD: biecuoguo_password
        ports:
          - 12306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 打包
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: 起后端（local profile，Flyway 会建表）
        working-directory: backend
        run: |
          set -euo pipefail
          nohup java -jar target/*.jar --spring.profiles.active=local > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "后端起来了（第 $i 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::后端 180 秒内没起来"
          tail -n 150 "$RUNNER_TEMP/app.log"
          exit 1
      - name: 接口冒烟
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8080

          health=$(curl -fsS "$base/actuator/health")
          echo "$health" | grep -q '"status":"UP"' || { echo "::error::health 不是 UP: $health"; exit 1; }

          feed=$(curl -fsS "$base/api/v1/posts/page?tab=all&limit=2")
          echo "$feed" | grep -q '"code":"OK"' || { echo "::error::feed 响应包不对"; exit 1; }
          echo "$feed" | grep -q '"nextCursor"' || { echo "::error::feed 缺 nextCursor（游标分页契约）"; exit 1; }

          login=$(curl -fsS -X POST "$base/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@biecuoguo.local","password":"Admin@123456"}')
          token=$(echo "$login" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          [ -n "$token" ] || { echo "::error::登录没拿到 token"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/v1/posts/interaction-notices" -H "Authorization: Bearer $token")
          [ "$code" = "200" ] || { echo "::error::带 token 的接口返回 $code"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/auth/login")
          [ "$code" = "405" ] || { echo "::error::GET 一个只接受 POST 的接口应回 405，实际 $code"; exit 1; }

          missing=$(curl -sS -w '\n%{http_code}' "$base/api/v1/posts/999999/comments")
          echo "$missing" | grep -q 'POST_NOT_FOUND\|"code":"NOT_FOUND"' \
            || { echo "::error::不存在的帖子应回业务错误码：$missing"; exit 1; }
          echo "$missing" | tail -n 1 | grep -q '^404$' \
            || { echo "::error::业务错误应当配 HTTP 404：$missing"; exit 1; }

          refresh=$(echo "$login" | sed -n 's/.*"refreshToken":"\([^"]*\)".*/\1/p')
          [ -n "$refresh" ] || { echo "::error::登录响应里没有 refreshToken"; exit 1; }
          renewed=$(curl -fsS -X POST "$base/api/v1/auth/refresh" \
            -H 'Content-Type: application/json' \
            -d "{\"refreshToken\":\"$refresh\"}")
          echo "$renewed" | grep -q '"code":"OK"' || { echo "::error::refresh token 换不出新 access：$renewed"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/api/v1/auth/refresh" \
            -H 'Content-Type: application/json' \
            -d "{\"refreshToken\":\"$token\"}")
          [ "$code" = "401" ] || { echo "::error::access token 不该能当 refresh token 用，实际 $code"; exit 1; }

          echo "接口冒烟全部通过"
      - name: 生成的接口类型是否与后端一致
        # 后端还活着，正好拿它的 /v3/api-docs 重生成一遍，和仓库里的比。
        # 后端改了 DTO 却忘了 `npm run gen:api` + 同步 types.ts，这一步会红。
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run gen:api
          cd ..
          if ! git diff --exit-code -- frontend/src/api-types.ts; then
            echo "::error::frontend/src/api-types.ts 与后端 DTO 不一致：本地跑 cd frontend && npm run gen:api 后一起提交"
            exit 1
          fi
      - name: 失败时打印后端日志
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/app.log" || true
